settings:
  sql_time_limit_ms: 15000
  truncate_cells_html: 10000
  allow_facet: false
plugins:
  datasette-block-robots:
    literal: |-
      User-agent: *
      Disallow: /
      User-agent: ChatGPT-User
      Disallow:
      User-agent: Claude-User
      Disallow:
  datasette-faiss:
    tables:
    - ["simonwillisonblog", "blog_entry_embeddings"]
databases:
  simonwillisonblog:
    queries:
      recent_content:
        sql: |-
          select
            'blogmark' as type,
            created,
            link_title as title,
            'https://simonwillison.net/b/' || id as link
          from
            blog_blogmark
          union all
          select
            'entry',
            created,
            title,
            'https://simonwillison.net/e/' || id
          from
            blog_entry
          union all
          select
            'quotation' as type,
            created,
            source || ': ' || quotation as title,
            'https://simonwillison.net/q/' || id as link
          from
            blog_quotation
          order by
            created desc
